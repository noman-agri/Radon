<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Radon logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#140c2b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint circuit grid -->
  <g stroke="#6366f1" stroke-opacity="0.18" stroke-width="2" fill="none">
    <path d="M60 150 H130 M60 256 H130 M60 362 H130 M382 400 H452 M382 112 V60"/>
    <circle cx="60" cy="150" r="4"/><circle cx="60" cy="256" r="4"/><circle cx="60" cy="362" r="4"/>
    <circle cx="452" cy="400" r="4"/><circle cx="382" cy="60" r="4"/>
  </g>

  <!-- R monogram drawn as circuit traces -->
  <g fill="none" stroke="url(#ink)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M150 382 V130 H270 A66 66 0 0 1 270 262 H150"/>
    <path d="M250 262 L340 382"/>
  </g>

  <!-- neural nodes at the trace junctions -->
  <g fill="#0b1020" stroke="url(#ink)" stroke-width="8" filter="url(#glow)">
    <circle cx="150" cy="130" r="17"/>
    <circle cx="150" cy="382" r="17"/>
    <circle cx="150" cy="262" r="17"/>
    <circle cx="340" cy="382" r="17"/>
  </g>

  <!-- swarm: three linked agents reaching consensus -->
  <g filter="url(#glow)">
    <path d="M372 150 L420 120 L428 182 Z" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="372" cy="150" r="11" fill="#22d3ee"/>
    <circle cx="420" cy="120" r="11" fill="#818cf8"/>
    <circle cx="428" cy="182" r="11" fill="#e879f9"/>
  </g>
</svg>
